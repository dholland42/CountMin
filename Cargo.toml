[package]
name = "countmin"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
csv = "1.3.1"
rand = "0.9.0"
serde = { version = "1.0.218", features = ["derive"] }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.jemallocator]
version = "0.5.4"

[profile.release]
strip = true
